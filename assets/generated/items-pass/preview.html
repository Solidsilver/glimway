<!doctype html><meta charset="utf-8"><title>Fingersnap — Items art</title>
<style>body{background:#232923;color:#f1e3c1;font:15px system-ui;margin:24px}header{position:sticky;top:0;background:#232923;padding:12px;z-index:2}select{font:inherit;padding:8px}section{display:flex;flex-wrap:wrap;gap:12px}article{background:#353d34;border:1px solid #68715e;padding:12px;overflow:hidden}small{display:block;max-width:360px;overflow-wrap:anywhere;margin-bottom:8px}canvas{image-rendering:pixelated;background:repeating-conic-gradient(#485244 0% 25%,#566150 0% 50%) 0/16px 16px}#status{margin:8px 0}</style>
<header><b>Fingersnap · Items art</b> <select id="sheet"></select><div id="status"></div>Frames appear at their exact game canvas dimensions, enlarged with nearest-neighbour pixels for inspection. Source sheets remain transparent and unchanged.</header><section id="frames"></section>
<script type="module">
const manifest=await(await fetch('./manifest.json')).json(),images={};
await Promise.all(manifest.sources.map(async s=>{const im=new Image();im.src=s.file;await im.decode();images[s.key]=im}));
const select=document.querySelector('#sheet');select.add(new Option('All frames','all'));for(const s of manifest.sources)select.add(new Option(s.key.replace('items-',''),s.key));
const native=f=>{const c=document.createElement('canvas');c.width=f.width;c.height=f.height;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const s=f.sourceRect,d=f.destinationRect;ctx.drawImage(images[f.source],s.x,s.y,s.w,s.h,d.x,d.y,d.w,d.h);return c};
function draw(){const section=document.querySelector('#frames');section.replaceChildren();for(const f of manifest.frames.filter(f=>select.value==='all'||f.source===select.value)){const a=document.createElement('article');a.style.width=Math.max(220,Math.min(400,f.width*4))+'px';const label=document.createElement('small');label.textContent=f.key+' · '+f.width+' × '+f.height+(f.state?' · '+f.state:'');const c=native(f),scale=Math.min(8,Math.max(2,Math.floor(384/f.width)));c.style.width=f.width*scale+'px';c.style.height=f.height*scale+'px';a.append(label,c);section.append(a)}document.querySelector('#status').textContent=manifest.sources.length+' transparent sheets · '+manifest.frames.length+' measured frames · '+manifest.animations.length+' looping animations · '+manifest.stateGroups.length+' discrete state groups';}
select.onchange=draw;draw();window.artInspection={manifest,images,native};
</script>
