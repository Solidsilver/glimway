syntax = "proto3";
package glimway.content.v1;
option go_package = "glimway/gen/glimway/content/v1;contentv1";
import "buf/validate/validate.proto";

// The homestead contract (content/homestead.json): the tiers a home grows
// through, the indoor room and wild land every homestead is generated on,
// the Commons lane's gates, and the home goods a player can buy.
message Homestead {
  option (buf.validate.message).cel = {
    id: "homestead.deed_lost_after_desolate"
    message: "a deed is lost only after the land goes desolate"
    expression: "this.desolation.deed_lost_after_days > this.desolation.desolate_after_days"
  };
  option (buf.validate.message).cel = {
    id: "homestead.indoor"
    message: "the indoor room is the designed 12x10"
    expression: "this.indoor.width == 12 && this.indoor.height == 10"
  };
  // The tier ladder is exactly the designed five (Campsite, Cottage,
  // Workshop, Garden, Hall); the per-tier rules stay in code.
  repeated HomeTier tiers = 1 [(buf.validate.field).repeated = {min_items: 5, max_items: 5}];
  // The indoor room: 12x10 tiles.
  HomeGrid indoor = 2 [(buf.validate.field).required = true];
  // Every homestead's wild land.
  HomeLand land = 3 [(buf.validate.field).required = true];
  // The Commons lane's gates (client tiles).
  CommonsLane commons = 4 [(buf.validate.field).required = true];
  // Reserved tiles (the home site, the gate path, the indoor doorway):
  // decorations may not cover them. The bounds against their grids are
  // code rules — one list sits on the land, one in the room.
  repeated HomeRect outdoor_reserved = 5 [(buf.validate.field).repeated.min_items = 1];
  repeated HomeRect indoor_reserved = 6 [(buf.validate.field).repeated.min_items = 1];
  LanternPosts lantern_posts = 7 [(buf.validate.field).required = true];
  // Deeding: the first deed is free, then it costs glims.
  HomesteadDeeds deeds = 8 [(buf.validate.field).required = true];
  // Clearing one wild tile costs glims.
  int32 clear_tile_glims = 9 [(buf.validate.field).int32.gte = 1];
  // Neglect: how long away turns the land desolate, then loses the deed.
  HomesteadDesolation desolation = 10 [(buf.validate.field).required = true];
  // A joint deed's confirmation window and invite lifetime.
  HomesteadJointDeed joint_deed = 11 [(buf.validate.field).required = true];
  // The personal chest's capacity.
  HomesteadPersonalChest personal_chest = 12 [(buf.validate.field).required = true];
  // The home goods (one row per furnishing the homestead sells).
  repeated HomeItem items = 13 [(buf.validate.field).repeated.min_items = 1];
  // The stable: one placed piece that grows east a bay at a time (3.2).
  HomesteadStable stable = 14 [(buf.validate.field).required = true];
  // The lot lantern on each lot's back line (hearthwick-2.md 6): lit, it
  // holds the backland chunk behind the lot across turnings.
  LotLantern lot_lantern = 15 [(buf.validate.field).required = true];
  // The way-lamp (roadmap 0.13; lamps.md 2.5): set in the Wilds, it holds
  // one chunk as a camp while it has oil.
  WayLamp way_lamp = 16 [(buf.validate.field).required = true];
  // Communal lamps (roadmap 0.13; lamps.md 1.3, 2.4): Common light, kept by
  // presence, never by oil.
  CommunalLamp communal_lamp = 17 [(buf.validate.field).required = true];
  // Naming a lamp from parts (lamps.md 2.8).
  LampNamingRules lamp_naming = 18 [(buf.validate.field).required = true];
  // The Wick Tree's weekly sap and the chandler's refining (lamps.md 2.5).
  WickSap wick_sap = 19 [(buf.validate.field).required = true];
}

// The Wick Tree's weekly sap (lamps.md 2.5): once a calendar wick, anyone
// standing within reach tiles of the tree's spot (area, tx, ty) taps qty
// of `item`; at `refiner` (a seller) one of it refines, free, into
// oil_qty of `oil`. Code checks that the item, the oil and the seller exist.
message WickSap {
  string item = 1 [(buf.validate.field).string.pattern = "^[a-z0-9-]{1,100}$"];
  int32 qty = 2 [(buf.validate.field).int32 = {gte: 1, lte: 12}];
  string area = 3 [(buf.validate.field).string = {in: ["hearthwick"]}];
  int32 tx = 4 [(buf.validate.field).int32 = {gte: 0, lte: 1048576}];
  int32 ty = 5 [(buf.validate.field).int32 = {gte: 0, lte: 1048576}];
  int32 reach = 6 [(buf.validate.field).int32 = {gte: 1, lte: 8}];
  string refiner = 7 [(buf.validate.field).string.pattern = "^[a-z0-9-]{1,100}$"];
  string oil = 8 [(buf.validate.field).string.pattern = "^[a-z0-9-]{1,100}$"];
  int32 oil_qty = 9 [(buf.validate.field).int32 = {gte: 1, lte: 12}];
}

// Communal lamps (lamps.md 2.5's "Communal stone relight" and "New communal
// post"): anyone relights a dark lamp stone of the Lantern Road, burning
// relight_qty of `relight` (0: free), or sets the way-lamp piece as a
// communal post, with no oil and no store. reach is how far, in tiles, a
// player may relight, tend, set or lift from.
message CommunalLamp {
  string relight = 1 [(buf.validate.field).string.pattern = "^[a-z0-9-]{1,100}$"];
  int32 relight_qty = 2 [(buf.validate.field).int32 = {gte: 0, lte: 12}];
  int32 reach = 3 [(buf.validate.field).int32 = {gte: 1, lte: 8}];
}

// Naming a lamp from parts (lamps.md 2.8), never free text: "You are the
// <ordinal> lamp <relation> <landmark>. Behind you <behind>; ahead <ahead>.
// <closing>" and the short name "<Ordinal> lamp <relation> <landmark>". A
// landmark is one the server finds near the lamp (a place's landmark by
// its kind, a site by its kind, within one chunk of the lamp's) or a
// fallback, always offered; behind and ahead are a side phrase or an
// offered landmark. A lamp's first naming gives ash_qty of `ash`, once.
// Ids are unique within each list, and no side shares a fallback's id
// (code rules).
message LampNamingRules {
  repeated NamingWord ordinals = 1 [(buf.validate.field).repeated = {min_items: 1, max_items: 40}];
  repeated NamingWord relations = 2 [(buf.validate.field).repeated = {min_items: 1, max_items: 12}];
  repeated NamingWord fallbacks = 3 [(buf.validate.field).repeated = {min_items: 1, max_items: 12}];
  map<string, string> places = 4;
  map<string, string> sites = 5;
  repeated NamingWord sides = 6 [(buf.validate.field).repeated = {min_items: 1, max_items: 24}];
  repeated NamingWord closings = 7 [(buf.validate.field).repeated = {min_items: 1, max_items: 12}];
  string ash = 8 [(buf.validate.field).string.pattern = "^[a-z0-9-]{1,100}$"];
  int32 ash_qty = 9 [(buf.validate.field).int32 = {gte: 1, lte: 5}];
}

// One part a naming may use: its id, and the words it puts in the sentence.
message NamingWord {
  string id = 1 [(buf.validate.field).string.pattern = "^[a-z0-9-]{1,40}$"];
  string words = 2 [(buf.validate.field).string = {min_len: 1, max_len: 40}];
}

// The way-lamp's camp (lamps.md 2.5): `item` is the home piece set as the
// lamp (a camp-only piece); its oil works as the lot lantern's does. reach
// is how far, in tiles, a player may set, fill or build from.
message WayLamp {
  string item = 1 [(buf.validate.field).string.pattern = "^[a-z0-9-]{1,100}$"];
  string oil = 2 [(buf.validate.field).string.pattern = "^[a-z0-9-]{1,100}$"];
  int32 max_wicks = 3 [(buf.validate.field).int32 = {gte: 1, lte: 12}];
  int32 wicks_per_oil = 4 [(buf.validate.field).int32 = {gte: 1, lte: 12}];
  int32 reach = 5 [(buf.validate.field).int32 = {gte: 1, lte: 8}];
}

// The lot lantern's oil (roadmap 0.12): one `oil` item adds wicks_per_oil
// wicks, up to max_wicks; one wick burns at each turning, then it dims
// for a wick before it goes dark. stake_y is the lot-local row of the
// lantern-line stake that carries it.
message LotLantern {
  string oil = 1 [(buf.validate.field).string.pattern = "^[a-z0-9-]{1,100}$"];
  int32 max_wicks = 2 [(buf.validate.field).int32 = {gte: 1, lte: 12}];
  int32 wicks_per_oil = 3 [(buf.validate.field).int32 = {gte: 1, lte: 12}];
  int32 stake_y = 4 [(buf.validate.field).int32 = {gte: 2, lte: 21}];
}

// The stable's growth rules (docs/design/crafts.md 3.1, 3.2, 6.3). The
// piece's buy price is its home-item row; StallCost is the **first extra**
// bay's bill, and each bay after it adds Growth to each material named
// there (a material outside Growth — fiber — stays flat). The rules that
// read the item row (it exists, it is the stable) are the loaders'.
message HomesteadStable {
  string item = 1 [(buf.validate.field).string.pattern = "^[a-z0-9-]{1,100}$"];
  int32 max_stalls = 2 [(buf.validate.field).int32 = {gte: 1, lte: 6}];
  map<string, int32> stall_cost = 3 [(buf.validate.field).map = {
    min_pairs: 1
    values: {int32: {gte: 1, lte: 1000000}}
  }];
  map<string, int32> growth = 4 [(buf.validate.field).map.values.int32 = {gte: 0, lte: 1000000}];
}

// A placement grid's size in tiles (the indoor room's 12x10 is the
// Homestead's own CEL).
message HomeGrid {
  optional int32 width = 1 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 1];
  optional int32 height = 2 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 1];
}

// One step of the tier ladder. Tier and id are positional (tier 2 is
// "tier-2"); only the Cottage and the Workshop are bought.
message HomeTier {
  int32 tier = 1;
  string id = 2;
  string name = 3 [(buf.validate.field).string.min_len = 1];
  bool purchasable = 4;
  int32 glims = 5 [(buf.validate.field).int32.gte = 0];
  // The Workshop's material bill (the only priced-in-materials tier);
  // checked against the wilds catalogue in code.
  map<string, int32> materials = 6 [(buf.validate.field).map.values.int32 = {gte: 1, lte: 1000000}];
}

// A rectangle in local grid tiles (reserved scenery on the land or in a
// room; the bounds against the grid it sits in are a code rule).
message HomeRect {
  optional int32 x = 1 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 0];
  optional int32 y = 2 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 0];
  optional int32 w = 3 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 1];
  optional int32 h = 4 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 1];
}

// Every homestead's wild land: its size, the home site (camp/cottage), the
// shared path stem, the starting light, and how much of the
// wild the generator scatters (server/internal/land).
message HomeLand {
  option (buf.validate.message).cel = {
    id: "home_land.site_inside"
    message: "the home site sits inside the land"
    expression: "this.site.x + this.site.w <= this.width && this.site.y + this.site.h <= this.height"
  };
  option (buf.validate.message).cel = {
    id: "home_land.gate_inside"
    message: "the gate mouth sits inside the land"
    expression: "this.gate.x + this.gate.w < this.width"
  };
  option (buf.validate.message).cel = {
    id: "home_land.light_inside"
    message: "the starting light sits inside the land"
    expression: "this.start_light.x < this.width && this.start_light.y < this.height"
  };
  int32 generator = 1 [(buf.validate.field).int32.const = 2];
  int32 width = 2 [(buf.validate.field).int32 = {gte: 20, lte: 120}];
  int32 height = 3 [(buf.validate.field).int32 = {gte: 16, lte: 120}];
  HomeRect site = 4 [(buf.validate.field).required = true];
  HomeGate gate = 5 [(buf.validate.field).required = true];
  HomeStartLight start_light = 6 [(buf.validate.field).required = true];
  int32 trees = 7 [(buf.validate.field).int32.gte = 0];
  int32 stumps = 8 [(buf.validate.field).int32.gte = 0];
  int32 boulders = 9 [(buf.validate.field).int32.gte = 0];
  int32 stream_permille = 10 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  int32 slope_permille = 11 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  map<string, HomeLandSide> sides = 12;
}

// Ground and obstacle mix on either side of town. The home site never mirrors.
message HomeLandSide {
  string ground = 1 [(buf.validate.field).string = {in: ["woods", "meadow"]}];
  int32 trees = 2 [(buf.validate.field).int32.gte = 0];
  int32 stumps = 3 [(buf.validate.field).int32.gte = 0];
  int32 boulders = 4 [(buf.validate.field).int32.gte = 0];
  int32 flowers = 5 [(buf.validate.field).int32.gte = 0];
}

// The shared vertical path stem: x and width in lot-local tiles.
message HomeGate {
  optional int32 x = 1 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 1];
  optional int32 w = 2 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 1];
}

// A point on the Commons map (pixels, with a reach in pixels).
message HomePixelPos {
  optional int32 x = 1 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 0];
  optional int32 y = 2 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 0];
  optional int32 radius = 3 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 1];
}

// The homestead's own lamp.
message HomeStartLight {
  optional int32 x = 1 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 1];
  optional int32 y = 2 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 1];
  optional int32 radius = 3 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 1];
}

// The homestead gates in the block-local frame (world x+48, y-24). Gate g is on
// side g%2 (fence column FenceX[side]) in row g/2: the listed rows, then
// one more every RowPitch tiles. DeedTable is where a joint deed is
// signed: Pell's table, in the deed office (a room's pixels, with the reach
// both partners must be within).
message CommonsLane {
  option (buf.validate.message).cel = {
    id: "commons.fence_order"
    message: "the east fence stands right of the west fence"
    expression: "size(this.fence_x) == 2 && this.fence_x[0] >= 0 && this.fence_x[1] > this.fence_x[0]"
  };
  // The gate rows' two-apart monotonicity is a code rule: CEL's all_idx is
  // outside the subset both runtimes ship.
  int32 tile_size = 1 [(buf.validate.field).int32.gte = 1];
  repeated int32 fence_x = 2 [(buf.validate.field).repeated = {min_items: 2, max_items: 2, items: {int32: {gte: 0}}}];
  repeated int32 gate_rows = 3 [(buf.validate.field).repeated = {min_items: 1, items: {int32: {gte: 0}}}]; // rows two apart: code rule (commons.gate_rows)
  int32 row_pitch = 4 [(buf.validate.field).int32.gte = 2];
  int32 spare_gates = 5 [(buf.validate.field).int32.gte = 1];
  reserved 6;
  reserved "silas_table";
  HomeDeedTable deed_table = 7 [(buf.validate.field).required = true];
}

// The deed table: a point in a room (pixels, with a reach in pixels). The
// room is checked in code.
message HomeDeedTable {
  string area = 1 [(buf.validate.field).string.pattern = "^in:[a-z0-9:-]{1,100}$"];
  optional int32 x = 2 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 0];
  optional int32 y = 3 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 0];
  optional int32 radius = 4 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 1];
}

// The post item, its light radius, and what the n-th post costs (the
// listed costs, then the last plus Growth for each one after).
message LanternPosts {
  string item = 1 [(buf.validate.field).string.min_len = 1];
  int32 radius = 2 [(buf.validate.field).int32.gte = 1];
  int32 name_max = 3 [(buf.validate.field).int32 = {gte: 1, lte: 80}];
  // The first posts' bills; checked against the wilds catalogue in code.
  repeated MaterialBill costs = 4 [(buf.validate.field).repeated.min_items = 1];
  // What each post after the list costs more; checked against the wilds
  // catalogue in code.
  map<string, int32> growth = 5 [(buf.validate.field).map.values.int32.gte = 0];
}

// One post's bill (a non-empty map; the keys are code rules).
message MaterialBill {
  map<string, int32> materials = 1 [(buf.validate.field).map = {min_pairs: 1, values: {int32: {gte: 1, lte: 1000000}}}];
}

message HomesteadDeeds {
  bool first_free = 1;
  int32 glims = 2 [(buf.validate.field).int32.gte = 1];
}

message HomesteadDesolation {
  int32 desolate_after_days = 1 [(buf.validate.field).int32.gte = 1];
  int32 deed_lost_after_days = 2 [(buf.validate.field).int32.gte = 1];
}

message HomesteadPersonalChest {
  int32 max_units = 1 [(buf.validate.field).int32.gte = 1];
}

message HomesteadJointDeed {
  int32 confirm_window_seconds = 1 [(buf.validate.field).int32.gte = 5];
  int32 invite_hours = 2 [(buf.validate.field).int32.gte = 1];
}

// One home good. The row only refers to the furnishings catalogue
// (content/furnishings.json) by id for its name and footprint; the loader
// fills those in, so nothing is copied in two places. A row that spells
// them out must match the catalogue, never disagree with it (a code rule).
message HomeItem {
  option (buf.validate.message).cel = {
    id: "home_item.price"
    message: "a home good is priced in glims, in materials, or in both; never neither"
    expression: "this.glims > 0 || size(this.materials) > 0"
  };
  option (buf.validate.message).cel = {
    id: "home_item.where"
    message: "where is one or two distinct scenes (indoor, outdoor, gate, camp)"
    expression: "size(this.where) > 0 && size(this.where) <= 2 && this.where.all(w, w in [\"indoor\", \"outdoor\", \"gate\", \"camp\"]) && (size(this.where) == 1 || this.where[0] != this.where[1])"
  };
  string id = 1 [(buf.validate.field).string.pattern = "^[a-z0-9-]{1,100}$"];
  string name = 2;
  string category = 3 [(buf.validate.field).string = {in: ["furniture", "decor", "utility"]}];
  repeated int32 footprint = 4;
  repeated string where = 5;
  int32 min_tier = 6 [(buf.validate.field).int32 = {gte: 0, lte: 4}];
  int32 glims = 7 [(buf.validate.field).int32.gte = 0];
  // The purchase bill (at most three lines): Wilds materials or any
  // carried material in the items catalogue — checked in code.
  map<string, int32> materials = 8 [(buf.validate.field).map = {max_pairs: 3, values: {int32: {gte: 1, lte: 1000000}}}];
  // Craftable only at the workbench (never bought).
  optional bool craft_only = 9;
  // A building: a structure on the plot (the stable; later the kiln).
  // Silas's Yard lists buildings in a section of their own.
  optional bool building = 10;
}
