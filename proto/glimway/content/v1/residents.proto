syntax = "proto3";
package glimway.content.v1;
option go_package = "glimway/gen/glimway/content/v1;contentv1";
import "buf/validate/validate.proto";

// The village's daily rhythm: who lives where and where each one stands over
// the day, spots and cycle phases in minutes. Areas reference rooms, so the
// cross-entry checks (a home that exists, a spot that fits) stay in code
// beside the loader. content/residents.json.
message Residents {
  option (buf.validate.message).cel = {
    id: "residents.unique_ids"
    message: "resident ids must be unique"
    expression: "this.residents.all(r, this.residents.filter(q, q.id == r.id).size() == 1)"
  };
  option (buf.validate.message).cel = {
    id: "residents.grace"
    message: "grace is at most one period"
    expression: "this.grace_seconds <= this.period_minutes * 60"
  };
  option (buf.validate.message).cel = {
    id: "residents.offsets"
    message: "a resident's offset is inside the period"
    expression: "this.residents.all(r, !has(r.offset_minutes) || r.offset_minutes < this.period_minutes)"
  };
  int32 period_minutes = 1 [(buf.validate.field).int32 = {gte: 1, lte: 1440}];
  int32 grace_seconds = 2 [(buf.validate.field).int32.gte = 0];
  repeated Resident residents = 3 [(buf.validate.field).repeated.min_items = 1];
}

message Resident {
  option (buf.validate.message).cel = {
    id: "resident.cycle_covers_spots"
    message: "every cycle phase names a spot, and every spot is used"
    expression: "this.cycle.all(p, p.spot in this.spots) && this.spots.all(k, this.cycle.exists(p, p.spot == k))"
  };
  option (buf.validate.message).cel = {
    id: "resident.home_used"
    message: "home is one of the resident's spots"
    expression: "!has(this.home) || this.spots.exists(k, this.spots[k].area == this.home)"
  };
  string id = 1 [(buf.validate.field).string.pattern = "^[a-z0-9-]{1,100}$"];
  optional int32 offset_minutes = 2 [(buf.validate.field).int32.gte = 0];
  optional string home = 3 [(buf.validate.field).string.pattern = "^(in:(village|woodland|ruin|commons):[a-z0-9]+(-[a-z0-9]+)*(:([2-9]|[1-9][0-9]+))?|in:home:(0|[1-9][0-9]{0,3}))$"];
  map<string, ResidentSpot> spots = 4 [(buf.validate.field).map = {
    min_pairs: 1
    keys: {string: {pattern: "^[a-z0-9-]{1,100}$"}}
  }];
  repeated ResidentPhase cycle = 5 [(buf.validate.field).repeated.min_items = 1];
}

message ResidentSpot {
  string area = 1 [(buf.validate.field).string.min_len = 1];
  optional int32 tx = 2 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 0];
  optional int32 ty = 3 [(buf.validate.field).required = true, (buf.validate.field).int32.gte = 0];
  optional bool seated = 4;
}

message ResidentPhase {
  string spot = 1 [(buf.validate.field).string.pattern = "^[a-z0-9-]{1,100}$"];
  int32 minutes = 2 [(buf.validate.field).int32.gte = 1];
}
