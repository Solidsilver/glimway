syntax = "proto3";
package glimway.v1;
option go_package = "glimway/server/internal/gen/glimway/v1;contract";
import "google/protobuf/wrappers.proto";

// Dir, Tile and Exit belonged to generator v2's chunk exits. Nothing uses them
// since contract 8; they stay defined because buf's FILE rule refuses a
// deleted message until a release ships without it.
enum Dir { DIR_UNSPECIFIED = 0; DIR_NORTH = 1; DIR_EAST = 2; DIR_SOUTH = 3; DIR_WEST = 4; }
enum SiteKind { SITE_KIND_UNSPECIFIED = 0; SITE_KIND_ECHO = 1; SITE_KIND_CAIRN = 2; SITE_KIND_NEST = 3; SITE_KIND_PLANK = 4; SITE_KIND_GIVEN = 5; SITE_KIND_REEDS = 6; SITE_KIND_LAMP_STONE = 7; SITE_KIND_RUMOUR = 8; }
message Tile { uint32 tx = 1; uint32 ty = 2; }
message Exit { uint32 tx = 1; uint32 ty = 2; uint32 tw = 3; uint32 th = 4; Dir dir = 5; string to = 6; Tile entry = 7; }
// All piece arrays have equal length; kind indexes kinds. flags holds two bits
// per piece, least significant first: flip, overhang.
message DecorList {
  repeated string kinds = 1; repeated uint32 kind = 2; repeated uint32 tx = 3; repeated uint32 ty = 4;
  repeated sint32 ox = 5; repeated sint32 oy = 6; repeated uint32 variant = 7; bytes flags = 8;
}
message StorySite { string id = 1; SiteKind kind = 2; uint32 tx = 3; uint32 ty = 4; }
// Renamed WorldChunk (location-seam.md 1.4); nothing reads or writes this
// message. It stays whole because buf's FILE rule refuses deleting it until
// a release ships without it.
message WildsChunk {
  option deprecated = true;
  reserved 2, 12, 15;
  reserved "region", "exits", "spawn";
  string epoch_id = 1; string realm = 3; sint32 layer = 4;
  sint32 cx = 5; sint32 cy = 6; uint32 generator_version = 7; uint32 size = 8;
  repeated string palette = 9; bytes ground = 10; bytes solid = 11;
  DecorList decor = 13; repeated StorySite sites = 14; string look = 16; string mark = 17;
  repeated WildsEntity entities = 18;
  uint32 tier = 19; string land = 20;
  repeated WildsPlaceMark places = 21;
}
// Ground: two row-major cells per byte, low nibble first. Solid: eight cells
// per byte, least significant bit first. Tiles are local; offsets are pixels.
// The key is (world, realm, layer, cx, cy) on signed chunk coordinates
// (open-map.md 2.1): tile (x, y) in world tiles lies in chunk
// (floor(x/size), floor(y/size)); north is -y.
message WorldChunk {
  // region, exits and spawn were generator v2's 3x3 regions (gone with v2).
  reserved 2, 12, 15;
  reserved "region", "exits", "spawn";
  string epoch_id = 1; string realm = 3; sint32 layer = 4;
  sint32 cx = 5; sint32 cy = 6; uint32 generator_version = 7; uint32 size = 8;
  repeated string palette = 9; bytes ground = 10; bytes solid = 11;
  DecorList decor = 13; repeated StorySite sites = 14; string look = 16; string mark = 17;
  // Bodies live in immutable chunks; the near read carries only state.
  repeated WildsEntity entities = 18;
  // The chunk's tier of difficulty (content tiers, wilds.Tier) and its main
  // land (a content land id, for the map).
  uint32 tier = 19; string land = 20;
  // The cell places whose landmark stands in this chunk (open-map.md 2.10).
  repeated WildsPlaceMark places = 21;
  // Where the ground comes from (location-seam.md 1.1). A fixed chunk is an
  // authored layout's (content/layouts/<layout>.json) at layout_revision;
  // its epoch_id is the pseudo-epoch "fixed:<layout>@<revision>", its
  // generator_version 0, its palette curated terrains, its look, land and
  // tier unset, and it carries objects instead of decor, sites, entities or
  // place marks.
  ChunkSource source = 22; uint32 layout_revision = 23;
  repeated Placed objects = 24;
}
// Unset is generated (still or wick): the generator never sets it, so the
// stored chunks' bytes are what they were before fixed chunks.
enum ChunkSource { CHUNK_SOURCE_UNSPECIFIED = 0; CHUNK_SOURCE_FIXED = 1; }
// An authored object on a fixed chunk (location-seam.md 1.2): a stable id, a
// kind, its tile (chunk-local; the chunk holding the tile owns the object
// and draws all of it, overhang included) and footprint, and what its kind
// needs. Kinds: tree, bush, rock (blocking pieces; a tree's variant is its
// canopy frame, width that canopy's width in px), overhang (a foreground
// occluder: variant its frame, width in px), prop and lamp (art with a
// collision base), scenery (drawn art), well, board, gate, sign, shelf
// (gate: its gate number; a gate also its side and the way through),
// exit, npc-post (npc, and the resident cycle's spot), repair (target, a
// repair site id) and gather (target, label). variant names the art
// (texture key or atlas frame), frame a frame in it. festival, when set,
// is the calendar festival or wick the object is out for.
message Placed {
  string id = 1; string kind = 2;
  uint32 tx = 3; uint32 ty = 4; uint32 tw = 5; uint32 th = 6;
  string variant = 7; string frame = 8; string festival = 9;
  PlacedArt art = 10; PlacedProp prop = 11; PlacedExit exit = 12;
  uint32 gate = 13; string side = 14;
  string npc = 15; string spot = 16;
  string target = 17; string label = 18;
  uint32 width = 19;
}
// Where a drawn piece's picture stands: its anchor in px from the object
// tile's north-west corner, bottom-centre unless origin_left (bottom-left).
// depth: a fixed draw depth; depth_y: sorted by the anchor (both unset: the
// renderer's default). tile: the piece stands for its object's tile (a
// gathered tuft goes with the tile).
message PlacedArt {
  sint32 ox = 1; sint32 oy = 2; bool origin_left = 3;
  optional sint32 depth = 4; bool depth_y = 5; bool flip = 6;
  optional uint32 tint = 7; bool tile = 8;
}
// An atlas prop: its display height and its collision box at the base, in
// px, and the light it carries (a lamp).
message PlacedProp { uint32 h = 1; uint32 body_w = 2; uint32 body_h = 3; string light = 4; }
// A way out: the area it leads to and where you arrive there. unlabelled
// hides its sign.
message PlacedExit { string to = 1; uint32 entry_tx = 2; uint32 entry_ty = 3; bool unlabelled = 4; }

// A cell's place (open-map.md 2.2, 2.10): id "place:<cellX>:<cellY>", kind a
// content place kind, (tx, ty) its landmark's chunk-local tile. A footprint
// is not a place mark; its places are content.
message WildsPlaceMark { string id = 1; string kind = 2; uint32 tx = 3; uint32 ty = 4; }
// A signed chunk key within a world (open-map.md 2.1).
message WildsChunkKey { string realm = 1; sint32 layer = 2; sint32 cx = 3; sint32 cy = 4; }
// An inclusive rectangle of chunks.
message WildsChunkRect { sint32 min_cx = 1; sint32 min_cy = 2; sint32 max_cx = 3; sint32 max_cy = 4; }
message WildsEntity {
  string id = 1; string kind = 2; uint32 tx = 3; uint32 ty = 4;
  repeated string enemies = 5; string material = 6; uint32 tier = 7; string poi = 8;
}
// starts_at and ends_at are Unix seconds. kind is "still" (one per world,
// never ends: the Tangle) or "wick" (one per world per wick: the Beyond).
// region_id was the 3x3 regions' (gone with region_epochs).
message WildsEpoch {
  reserved 3;
  reserved "region_id";
  string id = 1; string world_seed = 2; uint32 generator_version = 4;
  string season = 5; double starts_at = 6; google.protobuf.DoubleValue ends_at = 7;
  string kind = 8;
}
// available_at and at are Unix seconds.
message WildsEntityState {
  string id = 1; double cycle = 2; string state = 3; double available_at = 4;
  google.protobuf.StringValue by = 5; google.protobuf.DoubleValue at = 6; string epoch = 7;
  // A generated camp only, for the reader (shared-fights.md 1.9): this
  // cycle fell, the server stored the reader among its witnesses, and they
  // have not claimed it. The claim's own proof; false for every other kind.
  bool camp_claimable = 8;
}
// All time fields are Unix seconds.
message WildsPersonalClaim { string entity_id = 1; double at = 2; }
// All time fields are Unix seconds.
// epoch: the epoch the place was found in (this wick's, or a held chunk's
// pinned one: place ids repeat across wicks).
message WildsDiscovery { string entity_id = 1; string poi_id = 2; string discoverer_id = 3; string display_name = 4; double at = 5; string epoch = 6; }
// All time fields are Unix seconds.
message WildsLantern { string id = 1; string owner_id = 2; string display_name = 3; double x = 4; double y = 5; google.protobuf.StringValue lit_by = 6; double at = 7; google.protobuf.DoubleValue lit_at = 8; }
message EchoAssignment { string site = 1; string member = 2; bool settled = 3; }
// The 3x3 region read (GET /api/wilds/region/<id>) is gone: the near read
// replaced it in contract 8, and nothing reads or writes this message. It
// stays whole because buf's FILE rule refuses deleting it (or the map entry
// message its materials field makes) until a release ships without it.
message WildsRegionResult {
  option deprecated = true;
  WildsEpoch epoch = 1; repeated WildsEntityState entities = 2; repeated WildsPersonalClaim personal_claims = 3;
  repeated WildsDiscovery discoveries = 4; repeated WildsLantern lanterns = 5;
  map<string,double> materials = 6; repeated EchoAssignment echoes = 7;
}
// The frontier the server enforces (open-map.md 2.6): in 0.8 a rectangle
// (contract 8); 0.9's lamps add held chunks beside it.
message WildsFrontier { WildsChunkRect rect = 1; }

// One player-made change to one tile (section 3). tx and ty are local to
// the chunk the changes are stored under. change is "cleared", "stone" or
// "plank"; by is the account that made it; at is Unix seconds.
message GroundChange { uint32 tx = 1; uint32 ty = 2; string change = 3; string by = 4; double at = 5; }
// A chunk and epoch's changes: the world_changes row's state (entity
// "ground", kind "ground"), at most one entry a tile.
message GroundChanges { repeated GroundChange changes = 1; }
// One chunk's changes as the near read and the path operations carry them.
message ChunkGroundChanges { WildsChunkKey chunk = 1; string epoch = 2; GroundChanges changes = 3; }

// A chunk past the frontier, seen dimly through the veil (decision 22): its
// main land (a content land id) and whether the Wend crosses it. Never a
// made or stored chunk.
message WildsGlimpse { WildsChunkKey chunk = 1; string land = 2; bool river = 3; }

// A world tile, signed (open-map.md 2.1).
message WorldTile { sint32 x = 1; sint32 y = 2; }

// A named way (decision 23): a run of laid tiles joining two places (a
// place mark id, or a footprint's content id). id is "way:<a>:<b>", a < b;
// name is the words' wayName filled in; by is the account that laid most of
// it; tiles is the run's laid-tile count when the way was made or last
// rerouted; at is Unix seconds. The worldchange row (kind "way", entity id)
// holds this message as its state.
//
// path is the way's own line, in world tiles from a's end to b's: the
// shortest run of laid tiles from a tile within a's find radius (at a
// footprint, a tile on the opening it touches) to one within b's, each tile
// 4-adjacent to the one before. The whole path is carried even where it
// leaves the near window, so the client labels and draws the way from it
// alone. sign_a and sign_b are the tiles the two signs stand on: walkable,
// not laid, not on the path, 4-adjacent to the path's first and last tile.
//
// Geometry: the path is fixed when the way is made, and a lay never changes
// it (a run that grows keeps its ways' paths). A lift of a path tile
// reroutes the way along the new shortest run between the same two places,
// with new signs, if the pair is still joined; otherwise the way is broken.
// The name and by never change while the way stands.
message WildsWay {
  string id = 1; string a = 2; string b = 3; string name = 4; string by = 5;
  uint32 tiles = 6; string epoch = 7; double at = 8;
  repeated WorldTile path = 9; WorldTile sign_a = 10; WorldTile sign_b = 11;
}

// GET /api/wilds/near/<cx>/<cy> (open-map.md 2.4): the epochs, the
// frontier, and for the (2*radius+1)^2 chunks around (cx, cy) every state
// the chunk bodies don't carry. Entity states, claims, discoveries and
// lanterns name their epoch (or their entity's chunk, which picks it).
message WildsNearResult {
  WildsEpoch still = 1; WildsEpoch wick = 2; WildsFrontier frontier = 3;
  WildsChunkKey center = 4; uint32 radius = 5;
  repeated WildsEntityState entities = 6; repeated WildsPersonalClaim personal_claims = 7;
  repeated WildsDiscovery discoveries = 8; repeated WildsLantern lanterns = 9;
  // Echo assignments, where the window overlaps the Whitequiet.
  repeated EchoAssignment echoes = 10;
  repeated ChunkGroundChanges ground = 11;
  map<string,double> materials = 12;
  // The chunks within 2 outside the frontier that border the window.
  repeated WildsGlimpse glimpse = 13;
  // Ways with a tile in the window.
  repeated WildsWay ways = 14;
  // Every chunk of the window on the grid (location.OnGrid), row-major:
  // its source ("fixed", "generated" or "held") and the epoch its body is
  // read under (a fixed chunk's pseudo-epoch, a held chunk's pinned wick
  // epoch). Only generated and held chunks carry state.
  repeated NearChunk chunks = 15;
  // The wick epochs the window's held chunks are pinned to, other than this
  // wick (roadmap 0.12 holds): their entity states, claims and ground
  // changes ride under them.
  repeated WildsEpoch held = 16;
  // Status of the occupied chunk only: neighbouring reads are not exploration.
  WildsMapStatus land = 17;
}
message NearChunk { WildsChunkKey chunk = 1; string source = 2; string epoch = 3; }

// This wick's rumour (decision 19), in the state the client reads at start;
// unset when there is none. The client builds Elara's words from the parts
// and the content's rumour phrase tables: landmark is the place kind's
// landmark decor kind, compass one of n ne e se s sw w nw (from the Commons
// gate), ring the ring past the Whitequiet. site is the find's id
// ("rumour:<cx>:<cy>"), opened whether this player has opened it.
message WildsRumour {
  string epoch = 1; string place = 2; string landmark = 3; string compass = 4;
  uint32 ring = 5; bool past_river = 6; string site = 7; bool opened = 8;
}

message WildsMaterial { string id = 1; double qty = 2; }
message WildsLoot { repeated WildsMaterial materials = 1; google.protobuf.StringValue trinket = 2; }
// Row-major LAND vocabulary: grass, tree, stump, boulder, water, ford, slope, edge, path.
// D owns generation; generator_version versions this geometry.
message HomesteadLand { uint32 width = 1; uint32 height = 2; repeated string cells = 3; uint32 generator_version = 4; }

// Read-only map status. Exploration is device-local, as for map terrain:
// callers submit only explored keys, in batches of at most 256. This read
// neither generates terrain nor credits presence. No capabilities ride here.
message WildsMapRequest { repeated WildsChunkKey explored = 1; }
message WildsMapStatus {
  string wick = 1;
  repeated ChunkLandStatus chunks = 2;
  // Explored lamps and the reader's own lot lantern (its known fixed stake).
  repeated MapLamp lamps = 3;
}
message ChunkLandStatus {
  WildsChunkKey chunk = 1;
  // wild, common, built; permanent and still are outside oil upkeep.
  string tier = 2;
  bool visited = 3;
  string claim_id = 4;
  bool dimming = 5;
  uint32 reserve = 6; // charged wicks, excluding the warning wick
  uint32 cost = 7; // wicks charged each turning
  // held, dimming, turns, released, carries, paths-turn, lamps-carry,
  // lamps-turn (a chunk whose only Common work is communal lamps),
  // detail-turns, permanent
  string next_turning = 8;
  // Built terrain stays pinned even when its mark is far outside the near window.
  WildsEpoch epoch = 9;
  // Known Common paths, so a map read outside the near window keeps their line.
  GroundChanges ground = 10;
  // A Built claim's keeper, as the reader sees it (the in-world chip):
  // keeper is a camp's setter's display name (empty for a lot lantern);
  // yours: the reader set this camp, or lives on this lantern's lot.
  string keeper = 11;
  bool yours = 12;
}
message MapLamp {
  string id = 1;
  // lot-lantern, way-lamp, common-lamp (a communal light: a relit road stone
  // or a communal post, id its stable lamp id; name, naming and namer stay
  // empty until a Keeper names it).
  string kind = 2;
  sint32 x = 3; sint32 y = 4; // world tiles; never reveal adjacent terrain
  double at = 5;
  string name = 6; string naming = 7; string namer = 8;
  ChunkLandStatus land = 9;
  bool mage_lit = 10;
}
