<!doctype html><meta charset="utf-8"><title>Fingersnap — Commons art</title>
<style>body{background:#222a26;color:#f7e4b8;font:15px system-ui;margin:24px}header{position:sticky;top:0;background:#222a26;padding:12px;z-index:2}select,button{font:inherit;padding:8px}section{display:flex;flex-wrap:wrap;gap:12px}article{background:#343e33;border:1px solid #6d7354;padding:12px;width:230px}canvas{image-rendering:pixelated;background:repeating-conic-gradient(#4b5644 0% 25%,#58634e 0% 50%) 0/16px 16px;max-width:100%}small{display:block;overflow-wrap:anywhere;margin:6px 0}#status{margin:8px}</style>
<header><b>Fingersnap · Commons art</b> <select id="sheet"></select> <button id="background">Change background</button><div id="status"></div>Each frame is rendered at its native game size, then enlarged 4× for inspection. Foot anchor is the bottom centre.</header><section id="frames"></section>
<script type="module">
const manifest=await(await fetch('./manifest.json')).json();const images={};
await Promise.all(manifest.sources.map(async s=>{const im=new Image();im.src=s.file;await im.decode();images[s.key]=im}));
const select=document.querySelector('#sheet');select.add(new Option('All frames','all'));for(const s of manifest.sources)select.add(new Option(s.key.replace('commons-',''),s.key));
const native=f=>{const c=document.createElement('canvas');c.width=f.width;c.height=f.height;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const s=f.sourceRect,d=f.destinationRect;ctx.drawImage(images[f.source],s.x,s.y,s.w,s.h,d.x,d.y,d.w,d.h);return c};
function draw(){document.querySelector('#frames').replaceChildren();for(const f of manifest.frames.filter(f=>select.value==='all'||f.source===select.value)){const a=document.createElement('article');a.dataset.key=f.key;a.style.width=Math.max(230,f.width*4)+'px';const label=document.createElement('small');label.textContent=f.key+' · '+f.width+' × '+f.height;const c=native(f);c.style.width=f.width*4+'px';c.style.height=f.height*4+'px';a.append(label,c);document.querySelector('#frames').append(a)}document.querySelector('#status').textContent=manifest.sources.length+' transparent sheets · '+manifest.frames.length+' frames · '+manifest.animations.length+' animations';}
select.onchange=draw;draw();let light=false;document.querySelector('#background').onclick=()=>{light=!light;document.querySelectorAll('canvas').forEach(c=>c.style.background=light?'#dce8c7':'#283227')};
// Render a separate animation gallery without changing any source files.
const h=document.createElement('h2');h.textContent='Animation check';document.body.append(h);const gallery=document.createElement('section');document.body.append(gallery);
for(const animation of manifest.animations){const fs=animation.frames.map(k=>manifest.frames.find(f=>f.key===k));const a=document.createElement('article'),label=document.createElement('small');label.textContent=animation.key;const c=document.createElement('canvas');c.width=fs[0].width;c.height=fs[0].height;c.style.width=c.width*5+'px';const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const cells=fs.map(native);a.append(label,c);gallery.append(a);let index=0;setInterval(()=>{ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(cells[index++%cells.length],0,0)},1000/animation.frameRate)}
window.artInspection={manifest,images,native};
</script>
