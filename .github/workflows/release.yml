name: Publish GHCR image
on:
  push:
    tags: ['v*']
  # Called by tag-release.yml, which tags main when a release lands there: a
  # tag pushed with the workflow token doesn't start workflows by itself.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  # By hand, to publish an existing tag again (say, after a failed publish).
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish, such as v0.5.1
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          lfs: true
      - name: The tagged commit
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Require a semantic version tag (a release, or a pre-release such as v0.3.0-alpha.1)
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
      - name: Require the tag to match package.json
        run: |
          version=$(jq -r .version package.json)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $version (docs/releasing.md)"
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/solidsilver/glimway
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            # Pre-releases (vX.Y.Z-alpha.N) get only their own version tag.
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}
            type=raw,value=sha-${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/Solidsilver/glimway
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
      - name: Build and publish both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GLIMWAY_BUILD=${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          provenance: true
          sbom: true
