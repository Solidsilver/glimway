name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: glimway-ci-${{ github.run_id }}
      GLIMWAY_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci
      - name: Verify committed protobuf output
        run: |
          npm run proto
          git diff --exit-code -- server/internal/gen gen src/lib/gen
          test -z "$(git ls-files --others --exclude-standard server/internal/gen gen src/lib/gen)"
      - name: Check protobuf breaking changes against main and the latest release
        run: sh scripts/buf-breaking.sh
      - run: npm run verify
      # `go test` runs only part of vet: the copylocks check needs this (review
      # finding 7).
      - run: go vet ./...
      - run: go test ./...
      # Presence is concurrent: the race detector over the package that is.
      # The whole api package, not a targeted subset — it finds more (verify
      # is about 9 minutes with it here), and verify still ends well before
      # the full e2e job's 13 minutes.
      - run: go test -race -count=1 ./server/internal/api
      # The dev build's clock hooks (the e2e server is built with -tags dev).
      # Only the dev-tagged tests run here — all of them are named `TestDev…`
      # so this picks up every one — and the packages' own tests ran above.
      - run: go test -tags dev -run '^TestDev' ./server/cmd/glimway-server ./server/internal/api
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the container for smoke testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ghcr.io/solidsilver/glimway:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - name: Smoke test with a disposable Compose volume
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:8090/api/health | grep '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8090/ | grep '<title>Glimway</title>'
          test "$(docker compose exec -T glimway id -u)" = 10001
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove smoke-test containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  # The smoke tier on every push and pull request, on a GitHub-hosted runner
  # (software WebGL, so only the handful of critical-path tests).
  e2e-smoke:
    name: e2e smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - name: Identify Git LFS objects
        id: lfs
        run: echo "key=$(git lfs ls-files -l | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ runner.os }}-${{ steps.lfs.outputs.key }}
      - name: Fetch Git LFS art
        run: git lfs pull
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install Chromium and sqlite3
        run: |
          npx playwright install --with-deps chromium
          command -v sqlite3 || sudo apt-get install -y --no-install-recommends sqlite3
      - name: Run the smoke tier
        env:
          CI: '1'
          E2E_WORKERS: '2'
          SCREENS: ''
        run: npx playwright test --grep @smoke
      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-smoke-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The full suite, on the self-hosted runner with a GPU (docs/ci-runner.md).
  # A self-hosted runner executes whatever a workflow tells it to, so this job
  # runs only for pushes to this repository's own branches and for manual
  # dispatch, by the repository owner: never for pull requests, never for forks.
  e2e-full:
    name: e2e full (self-hosted GPU)
    if: >-
      github.repository == 'Solidsilver/glimway' &&
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/expansion' ||
         startsWith(github.ref, 'refs/heads/exp/'))))
    runs-on: [self-hosted, linux, x64, glimway-e2e]
    timeout-minutes: 30
    concurrency:
      group: e2e-full-${{ github.ref }}
      # Never on main: tag-release.yml tags the commit whose CI passed, so a
      # cancelled run would leave a release untagged.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    container:
      # Keep the tag on the @playwright/test version in package-lock.json: the
      # image's browsers are the ones that version expects.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # GPU through CDI (Docker 25+ with the NVIDIA Container Toolkit's spec).
      # The limits keep the job from starving the host's other services: RAM
      # capped at 6 GB (4 GB more may spill to swap), at most 12 CPUs at a low
      # weight, and everything under the host's glimway-ci.slice, which caps
      # the runner and its containers together.
      options: >-
        --device nvidia.com/gpu=all
        --cgroup-parent=glimway-ci.slice
        --memory=6g
        --memory-swap=10g
        --cpus=12
        --cpu-shares=256
        --pids-limit=8192
        --shm-size=1g
      volumes:
        # NixOS hosts: the runner's Node for JavaScript actions links into the
        # Nix store, and the NVIDIA driver files do too. Harmless elsewhere.
        - /nix/store:/nix/store:ro
        # Go, npm and apt caches kept between runs (Docker named volume).
        - glimway-e2e-cache:/cache
      env:
        NVIDIA_DRIVER_CAPABILITIES: all
        GOCACHE: /cache/go-build
        GOMODCACHE: /cache/go-mod
        npm_config_cache: /cache/npm
    env:
      CI: '1'
      E2E_GPU: nvidia
      # ANGLE backend: vulkan, or gl-egl (repository variable E2E_GPU_ANGLE).
      E2E_GPU_ANGLE: ${{ vars.E2E_GPU_ANGLE || 'vulkan' }}
      E2E_LOG_RENDERER: '1'
      # Four workers fit the memory cap (docs/ci-runner.md); the repository
      # variable E2E_RUNNER_WORKERS changes it without a commit.
      E2E_WORKERS: ${{ vars.E2E_RUNNER_WORKERS || '4' }}
      SCREENS: ''
    steps:
      - name: Install Git, Git LFS and sqlite3
        run: |
          mkdir -p /cache/apt/partial
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends -o Dir::Cache::Archives=/cache/apt git git-lfs sqlite3
          # The checkout belongs to the runner's user and the container runs
          # as root: without this, Git refuses the repository after the
          # checkout step, and `go build` fails to read its VCS stamp.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Point Vulkan and EGL at the NVIDIA driver
        run: |
          nvidia-smi -L || echo "nvidia-smi is not in the container; the renderer check below decides"
          for icd in /run/opengl-driver/share/vulkan/icd.d/nvidia_icd.json \
                     /usr/share/vulkan/icd.d/nvidia_icd.json /etc/vulkan/icd.d/nvidia_icd.json; do
            if [ -f "$icd" ]; then printf "VK_DRIVER_FILES=%s\nVK_ICD_FILENAMES=%s\n" "$icd" "$icd" >> "$GITHUB_ENV"; echo "Vulkan ICD: $icd"; break; fi
          done
          for egl in /run/opengl-driver/share/glvnd/egl_vendor.d /usr/share/glvnd/egl_vendor.d; do
            if [ -f "$egl/10_nvidia.json" ]; then echo "__EGL_VENDOR_LIBRARY_DIRS=$egl" >> "$GITHUB_ENV"; echo "EGL vendor: $egl"; break; fi
          done
      - name: Check the WebGL renderer
        run: npx playwright install chromium && node scripts/webgl-renderer.ts
      - name: Run the full suite
        run: nice -n 10 npx playwright test
      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-full-failures
          # Screenshots and error context only: a bad run's traces came to 2.6 GB
          # and ran the job past its timeout while uploading.
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
