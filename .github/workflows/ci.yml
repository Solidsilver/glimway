name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: glimway-ci-${{ github.run_id }}
      GLIMWAY_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci
      - name: Verify committed protobuf output
        run: |
          npm run proto
          git diff --exit-code -- server/internal/gen src/lib/gen
          test -z "$(git ls-files --others --exclude-standard server/internal/gen src/lib/gen)"
      - name: Check protobuf breaking changes against main
        run: |
          git rev-parse --verify refs/remotes/origin/main
          if git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            GIT_LFS_SKIP_SMUDGE=1 node_modules/.bin/buf breaking --against '.git#ref=refs/remotes/origin/main'
          else
            echo "No protobuf schema on main yet; establishing the initial contract."
          fi
      - run: npm run verify
      - run: go test ./...
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the container for smoke testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ghcr.io/solidsilver/glimway:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - name: Smoke test with a disposable Compose volume
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:8090/api/health | grep '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8090/ | grep '<title>Glimway</title>'
          test "$(docker compose exec -T glimway id -u)" = 10001
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove smoke-test containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  e2e:
    name: e2e (${{ matrix.shard }}/5)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - name: Identify Git LFS objects
        id: lfs
        run: echo "key=$(git lfs ls-files -l | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ runner.os }}-${{ steps.lfs.outputs.key }}
      - name: Fetch Git LFS art
        run: git lfs pull
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run Playwright shard
        env:
          CI: '1'
          E2E_WORKERS: '2'
          SCREENS: ''
          E2E_LOG_RENDERER: '1'
        run: npx playwright test --shard=${{ matrix.shard }}/5 --workers=2
      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
